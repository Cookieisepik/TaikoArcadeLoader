name: Build and upload artifact

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check Visual Studio
        shell: pwsh
        run: |
          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"
          where.exe cl
          cl
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target bnusio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaikoArcadeLoader
          path: dist/
          compression-level: 9
