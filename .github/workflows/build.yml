```yaml
name: Build and upload artifact

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
    build:
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: Set up MSVC
              uses: ilammy/msvc-dev-cmd@v1
            - name: Configure CMake
              shell: cmd
              run: |
                  cmake -B build -S . -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
                  cmake -B build -S . -G "NMake Makefiles" ^
                    -DCMAKE_BUILD_TYPE=Release ^
                    -DCMAKE_POLICY_VERSION_MINIMUM=3.5

            # AI-GENERATED: added to fix dist/ not existing
            - name: Create dist directory
              shell: cmd
              run: mkdir dist

            - name: Build
              shell: cmd
              run: cmake --build build --config Release --target bnusio
            - uses: actions/upload-artifact@v4
              with:
                  name: TaikoArcadeLoader
                  path: dist/
                  compression-level: 9
```

